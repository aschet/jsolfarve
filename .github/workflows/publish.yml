name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/olfarve
    permissions:
      contents: read
      # npm authenticates and publishes via trusted publishing (OIDC), matching
      # the Trusted Publisher configured on npmjs.com for this repo, workflow
      # and environment. No token is stored; provenance is attached
      # automatically.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Verify the release matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Release tag '$tag' does not match package version '$version'" >&2
            exit 1
          fi
      - run: npm run lint:package
      - run: npm run test:coverage
      # Catches a version left unbumped, and anything else npm only validates
      # at actual publish time (an invalid package.json field, for instance).
      - run: npm run publish:dry-run
      - run: npm publish
